version: '3.8'

services:
  # PostgreSQL database for Kestra
  postgres:
    image: postgres:15
    container_name: kestra-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kestra server
  kestra:
    image: kestra/kestra:latest
    container_name: kestra-server
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./workflows:/app/storage/flows
      - kestra_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kestra executor (optional, for distributed execution)
  executor:
    image: kestra/kestra:latest
    container_name: kestra-executor
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
        micronaut:
          server:
            port: 8082
    ports:
      - "8082:8082"
    volumes:
      - ./workflows:/app/storage/flows
      - kestra_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      kestra:
        condition: service_healthy
    profiles:
      - executor

volumes:
  kestra_postgres_data:
  kestra_storage:
