<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelChain Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { margin: 5px; padding: 10px; }
    #log { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; background: #f9f9f9; }
    details { margin: 10px 0; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>SentinelChain Dashboard</h1>

  <div>
    <button onclick="runStage('faam')">Run FAAM</button>
    <button onclick="runStage('gen_payload')">Generate Payload</button>
    <button onclick="runStage('run_attack')">Run Attack</button>
    <button onclick="runStage('autofix')">AutoFix</button>
    <button onclick="runCodeRabbit()">Request CodeRabbit Report</button>
    <button onclick="runStage('export_report')">Export Report</button>
    <button onclick="openReport()">Open HTML Report</button>
  </div>

  <h2>Report</h2>
  <pre id="report">Loading...</pre>

  <h2>Events</h2>
  <div id="events">Loading...</div>

  <h2>Log</h2>
  <div id="log"></div>

  <script>
    async function loadReport() {
      try {
        const res = await fetch('/api/report');
        const data = await res.json();
        document.getElementById('report').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById('report').textContent = 'Error loading report';
      }
    }

    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();
        const container = document.getElementById('events');
        container.innerHTML = events.map(event => `
          <details>
            <summary>${event.type} at ${new Date(event.time).toLocaleString()}</summary>
            <pre>${JSON.stringify(event, null, 2)}</pre>
          </details>
        `).join('');
      } catch (e) {
        document.getElementById('events').innerHTML = 'Error loading events';
      }
    }

    async function runStage(stage) {
      try {
        const res = await fetch('/api/run-stage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stage })
        });
        const result = await res.json();
        log(`Stage ${stage}: ${result.success ? 'Success' : 'Failed'}`);
        if (result.stdout) log(result.stdout);
        if (result.stderr) log('STDERR: ' + result.stderr);
        if (result.error) log('ERROR: ' + result.error);
        loadReport();
        loadEvents();
      } catch (e) {
        log('Error running stage: ' + e.message);
      }
    }

    async function runCodeRabbit() {
      try {
        const res = await fetch('/api/coderabbit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        const result = await res.json();
        log(`CodeRabbit: ${result.success ? 'Success' : 'Failed'}`);
        if (result.stdout) log(result.stdout);
        if (result.stderr) log('STDERR: ' + result.stderr);
        if (result.error) log('ERROR: ' + result.error);
        loadEvents();
      } catch (e) {
        log('Error running CodeRabbit: ' + e.message);
      }
    }

    function openReport() {
      window.open('../ledger/report.html', '_blank');
    }

    function log(message) {
      const logDiv = document.getElementById('log');
      logDiv.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Load data on page load
    loadReport();
    loadEvents();
  </script>
</body>
</html>
